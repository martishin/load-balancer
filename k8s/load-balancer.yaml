apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-balancer
  namespace: load-balancer
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: load-balancer
  template:
    metadata:
      labels:
        app: load-balancer
    spec:
      containers:
        - name: load-balancer
          image: ghcr.io/martishin/load-balancer:latest
          imagePullPolicy: Always
          args:
            - "--backends"
            - "http://web:80"
            - "--port"
            - "80"
          ports:
            - containerPort: 80
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: load-balancer
  namespace: load-balancer
spec:
  selector:
    app: load-balancer
  ports:
    - name: http
      port: 80
      targetPort: 80
